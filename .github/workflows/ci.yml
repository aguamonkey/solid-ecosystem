name: Ecosystem checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup PYTHON=python
      - run: services/api/.venv/bin/python -m pip check
      - run: make check
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make browser
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - run: docker compose restart api && docker compose up -d --wait
      - name: Verify persisted observations after restart
        run: |
          python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/readings?limit=100')); assert data['readings']"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
