[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-ecosystem-api"
version = "0.1.0"
description = "Field Notebook's observation and receipt service"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
